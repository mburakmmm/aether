name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential curl

      - name: Install Nox
        run: |
          curl -fsSL https://raw.githubusercontent.com/mburakmmm/nox-lang/main/install.sh | NOX_VERSION=v2.1.186 bash
          echo "$HOME/.nox-lang/bin" >> "$GITHUB_PATH"

      - name: Check release refs (VERSION / nox.json / nox.lock)
        run: |
          chmod +x scripts/check_release_refs.sh
          ./scripts/check_release_refs.sh

      - name: Point package at checkout
        run: |
          python3 - <<'PY'
          import json, os
          ws = os.environ["GITHUB_WORKSPACE"]
          sha = os.environ["GITHUB_SHA"]
          data = {
            "name": "aether",
            "entry": "examples/hello_api/main.nox",
            "bin": {"name": "aether", "path": "cli.nox"},
            "requires": [{
              "alias": "aether",
              "repo": ws,
              "ref": "master",
            }],
          }
          with open("nox.json", "w", encoding="utf-8") as f:
            json.dump(data, f, indent=2)
            f.write("\n")
          lock = {
            "packages": [{
              "alias": "aether",
              "repo": ws,
              "ref": "master",
              "resolved": sha,
            }]
          }
          with open("nox.lock", "w", encoding="utf-8") as f:
            json.dump(lock, f, indent=2)
            f.write("\n")
          PY

      - name: Fetch & test
        run: |
          noxc --version
          noxc fetch
          fail=0
          for t in tests/*.nox; do
            echo "==> $t"
            if ! noxc test "$t"; then
              echo "FAILED: $t"
              fail=1
            fi
          done
          exit "$fail"

      - name: HTTP smoke (single worker)
        run: |
          chmod +x scripts/smoke_http.sh
          ./scripts/smoke_http.sh

      - name: HTTP smoke (multicore workers=2)
        run: |
          chmod +x scripts/smoke_http_multicore.sh
          ./scripts/smoke_http_multicore.sh

      - name: Worker AppBind probe (QBE)
        run: |
          chmod +x scripts/smoke_worker_bind.sh
          AETHER_PORT=34680 AETHER_WORKERS=2 AETHER_PROBE_MODE=qbe \
            AETHER_PROBE_REQUESTS=200 \
            ./scripts/smoke_worker_bind.sh

      - name: Graceful shutdown drain smoke (QBE)
        run: |
          chmod +x scripts/smoke_shutdown.sh
          AETHER_PORT=34681 AETHER_WORKERS=2 AETHER_PROBE_MODE=qbe \
            ./scripts/smoke_shutdown.sh

      - name: Package-install smoke
        run: |
          chmod +x scripts/smoke_package.sh
          ./scripts/smoke_package.sh

      - name: Keep-alive isolation
        run: |
          chmod +x scripts/smoke_keepalive.sh
          AETHER_PORT=34721 ./scripts/smoke_keepalive.sh

      - name: WebSocket reconnect
        run: |
          chmod +x scripts/smoke_ws.sh
          AETHER_PORT=34722 ./scripts/smoke_ws.sh

      - name: Drain signal and timeout
        run: |
          chmod +x scripts/smoke_drain_signal.sh
          AETHER_PORT=34723 ./scripts/smoke_drain_signal.sh

  release-smoke:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nox
        run: |
          curl -fsSL https://raw.githubusercontent.com/mburakmmm/nox-lang/main/install.sh | NOX_VERSION=v2.1.186 bash
          echo "$HOME/.nox-lang/bin" >> "$GITHUB_PATH"

      - name: Point package at checkout
        run: |
          python3 - <<'PY'
          import json, os
          ws = os.environ["GITHUB_WORKSPACE"]
          sha = os.environ["GITHUB_SHA"]
          data = {
            "name": "aether",
            "entry": "examples/hello_api/main.nox",
            "bin": {"name": "aether", "path": "cli.nox"},
            "requires": [{
              "alias": "aether",
              "repo": ws,
              "ref": "master",
            }],
          }
          with open("nox.json", "w", encoding="utf-8") as f:
            json.dump(data, f, indent=2)
            f.write("\n")
          lock = {
            "packages": [{
              "alias": "aether",
              "repo": ws,
              "ref": "master",
              "resolved": sha,
            }]
          }
          with open("nox.lock", "w", encoding="utf-8") as f:
            json.dump(lock, f, indent=2)
            f.write("\n")
          PY

      - name: Fetch
        run: noxc fetch

      - name: HTTP smoke multicore (default LLVM)
        run: |
          chmod +x scripts/smoke_http_multicore.sh
          AETHER_PORT=34570 ./scripts/smoke_http_multicore.sh

      - name: Worker AppBind probe (LLVM)
        run: |
          chmod +x scripts/smoke_worker_bind.sh
          AETHER_PORT=34683 AETHER_WORKERS=4 AETHER_PROBE_MODE=llvm \
            AETHER_PROBE_REQUESTS=200 \
            ./scripts/smoke_worker_bind.sh

      - name: HTTP smoke (noxc build --release)
        run: |
          chmod +x scripts/smoke_http_release.sh
          ./scripts/smoke_http_release.sh

      - name: Worker AppBind probe (--release)
        run: |
          chmod +x scripts/smoke_worker_bind.sh
          AETHER_PORT=34681 AETHER_WORKERS=4 AETHER_PROBE_MODE=release \
            AETHER_PROBE_REQUESTS=400 \
            AETHER_PROBE_REQUIRE_MULTI=1 \
            ./scripts/smoke_worker_bind.sh

      - name: Graceful shutdown drain smoke (--release)
        run: |
          chmod +x scripts/smoke_shutdown.sh
          AETHER_PORT=34682 AETHER_WORKERS=4 AETHER_PROBE_MODE=release \
            ./scripts/smoke_shutdown.sh

  http3:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Nox
        run: |
          curl -fsSL https://raw.githubusercontent.com/mburakmmm/nox-lang/main/install.sh | NOX_VERSION=v2.1.186 bash
          echo "$HOME/.nox-lang/bin" >> "$GITHUB_PATH"

      - name: Install OpenSSL 3.5 and an HTTP/3 client
        run: |
          brew install openssl@3 curl
          echo "$(brew --prefix curl)/bin" >> "$GITHUB_PATH"

      - name: Point package at checkout
        run: |
          python3 - <<'PY'
          import json, os
          ws = os.environ["GITHUB_WORKSPACE"]
          sha = os.environ["GITHUB_SHA"]
          data = {
            "name": "aether",
            "entry": "examples/hello_api/main.nox",
            "bin": {"name": "aether", "path": "cli.nox"},
            "requires": [{
              "alias": "aether",
              "repo": ws,
              "ref": "master",
            }],
          }
          with open("nox.json", "w", encoding="utf-8") as f:
            json.dump(data, f, indent=2)
            f.write("\n")
          lock = {
            "packages": [{
              "alias": "aether",
              "repo": ws,
              "ref": "master",
              "resolved": sha,
            }]
          }
          with open("nox.lock", "w", encoding="utf-8") as f:
            json.dump(lock, f, indent=2)
            f.write("\n")
          PY

      - name: Fetch
        run: noxc fetch

      - name: HTTP/3 handshake
        run: |
          chmod +x scripts/smoke_http3.sh
          AETHER_PORT=34733 AETHER_HTTP3_REQUIRED=1 \
            AETHER_CURL="$(brew --prefix curl)/bin/curl" \
            ./scripts/smoke_http3.sh
