name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  remote-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y build-essential curl

      - name: Install Nox
        run: |
          curl -fsSL https://raw.githubusercontent.com/mburakmmm/nox-lang/main/install.sh | NOX_VERSION=v2.1.186 bash
          echo "$HOME/.nox-lang/bin" >> "$GITHUB_PATH"
          echo "$HOME/.nox/bin" >> "$GITHUB_PATH"

      - name: Tag matches VERSION and refs
        run: |
          TAG="${GITHUB_REF_NAME}"
          VER="$(tr -d '[:space:]' < VERSION)"
          if [[ "$TAG" != "v${VER}" ]]; then
            echo "tag=$TAG VERSION=$VER mismatch" >&2
            exit 1
          fi
          chmod +x scripts/check_release_refs.sh
          ./scripts/check_release_refs.sh

      - name: Remote noxc install @tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          noxc install "github.com/mburakmmm/aether@${TAG}"
          aether version | tee /tmp/aether-version.txt
          grep -q "${TAG#v}" /tmp/aether-version.txt

      - name: Remote consumer fetch/check/run
        run: |
          TAG="${GITHUB_REF_NAME}"
          WORK="$(mktemp -d)"
          mkdir -p "$WORK/src"
          cat > "$WORK/nox.json" <<EOF
          {
            "name": "aether-remote-smoke",
            "entry": "src/main.nox",
            "requires": [
              {
                "alias": "aether",
                "repo": "github.com/mburakmmm/aether",
                "ref": "${TAG}"
              }
            ]
          }
          EOF
          cat > "$WORK/src/main.nox" <<'EOF'
          import aether.config
          import aether.application
          from aether.config import Config
          from aether.application import Application
          from aether.module import ModuleBuilder
          from aether.context import HttpContext
          from aether.response import json_ok
          from nox.http import HttpResponse

          def build(app: Application) -> None:
              m: ModuleBuilder = app.module()
              def ping(ctx: HttpContext) -> HttpResponse:
                  return json_ok("{\"pong\":true}")
              m.get("/ping", ping)

          cfg: Config = aether.config.defaults("test")
          cfg.log_requests = False
          app: Application = aether.application.boot_with_config(cfg, build)
          aether.application.shutdown(app)
          print("remote package smoke ok")
          EOF
          cd "$WORK"
          noxc fetch
          noxc check src/main.nox
          noxc run src/main.nox

      - name: Installed CLI scaffolds outside the tree
        run: |
          TAG="${GITHUB_REF_NAME}"
          WORK="$(mktemp -d)"
          cd "$WORK"
          aether new demo
          python3 - <<PY
          import json, os
          tag = os.environ["TAG"]
          ref = json.load(open("demo/nox.json"))["requires"][0]["ref"]
          if ref != tag:
              raise SystemExit("installed scaffold ref %s != %s" % (ref, tag))
          print("installed scaffold", ref)
          PY
          cd demo
          noxc fetch
          noxc check main.nox
          AETHER_ENV=test \
          AETHER_PORT=34771 \
          AETHER_WORKERS=1 \
          AETHER_OPENAPI=0 \
          AETHER_LOG_REQUESTS=0 \
          AETHER_METRICS=0 \
          AETHER_RATE_LIMIT=0 \
          noxc run main.nox > /tmp/aether-scaffold-http.log 2>&1 &
          PID=$!
          ok=0
          i=0
          while [[ $i -lt 120 ]]; do
            if curl -fsS "http://127.0.0.1:34771/" | grep -q demo; then
              ok=1
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              echo "scaffold server exited" >&2
              cat /tmp/aether-scaffold-http.log >&2 || true
              exit 1
            fi
            i=$((i + 1))
            sleep 0.5
          done
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true
          if [[ "$ok" -ne 1 ]]; then
            echo "scaffold http smoke failed" >&2
            cat /tmp/aether-scaffold-http.log >&2 || true
            exit 1
          fi
          echo "installed scaffold serves"
        env:
          TAG: ${{ github.ref_name }}

      - name: Scaffold pins this version
        run: |
          chmod +x scripts/smoke_scaffold.sh
          ./scripts/smoke_scaffold.sh
